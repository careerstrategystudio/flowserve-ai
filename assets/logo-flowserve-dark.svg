<svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <!-- ICONO: Flujo de IA (versión oscura) -->
  <g id="icon">
    <!-- Nodo central (IA) -->
    <circle cx="50" cy="60" r="12" fill="#1e40af" opacity="0.9"/>
    <circle cx="50" cy="60" r="10" fill="none" stroke="#1e40af" stroke-width="2" opacity="0.3"/>
    
    <!-- Nodo superior izquierda -->
    <circle cx="25" cy="35" r="8" fill="#0f172a" stroke="#1e40af" stroke-width="1.5"/>
    <!-- Línea conexión -->
    <line x1="32" y1="42" x2="43" y2="53" stroke="#1e40af" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Nodo superior derecha -->
    <circle cx="75" cy="30" r="8" fill="#0f172a" stroke="#1e40af" stroke-width="1.5"/>
    <!-- Línea conexión -->
    <line x1="68" y1="38" x2="57" y2="52" stroke="#1e40af" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Nodo inferior izquierda -->
    <circle cx="20" cy="80" r="8" fill="#0f172a" stroke="#1e40af" stroke-width="1.5"/>
    <!-- Línea conexión -->
    <line x1="28" y1="77" x2="41" y2="67" stroke="#1e40af" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Nodo inferior derecha -->
    <circle cx="80" cy="85" r="8" fill="#0f172a" stroke="#1e40af" stroke-width="1.5"/>
    <!-- Línea conexión -->
    <line x1="60" y1="68" x2="73" y2="79" stroke="#1e40af" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Símbolo de IA en el centro -->
    <text x="50" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff" font-family="Arial">⚡</text>
  </g>
  
  <!-- TEXTO -->
  <g id="text">
    <!-- "Flowserve" en oscuro -->
    <text x="115" y="75" font-size="42" font-weight="700" fill="#0f172a" font-family="Arial, sans-serif" letter-spacing="-0.5px">Flowserve</text>
    
    <!-- "AI" en azul -->
    <text x="350" y="75" font-size="42" font-weight="700" fill="#1e40af" font-family="Arial, sans-serif" letter-spacing="1px">AI</text>
    
    <!-- Tagline pequeño -->
    <text x="115" y="98" font-size="11" fill="#6b7280" font-family="Arial, sans-serif" letter-spacing="0.5px">AI AGENTS FOR HOSPITALITY</text>
  </g>
</svg>